<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diffusion: Wake</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="glCanvas"></canvas>

    <!-- The cursor leaves a fading ridge whose height is how fast it moved.
         Particles lean downhill, off the ridge, opening a wake behind the cursor. -->
    <script type="module">
        import { createContext, createProgram, createField, createDouble, createBoard, trackCursor, pass, run, STROKE_GLSL } from './diffusion.js';

        const TRAIL_HALF_LIFE = 0.5; // seconds for the ridge to fade to half

        // r: cursor speed (cells/s), kept at its max so faster strokes stay higher
        const TRAIL_FS = `#version 300 es
        precision highp float;
        precision highp sampler2D;
        uniform sampler2D u_trail;     // previous trail
        uniform vec2 u_from;           // cursor at the previous frame, in board cells
        uniform vec2 u_to;             // cursor now, in board cells
        uniform bool u_active;         // whether the cursor is on the canvas
        uniform float u_dt;            // seconds since the previous frame
        uniform float u_fade;          // how much of the previous trail survives this frame
        out vec4 fragColor;

        const float RADIUS = 20.0;     // width of the stroke, in cells
        ${STROKE_GLSL}

        void main() {
            float speed = u_fade * texelFetch(u_trail, ivec2(gl_FragCoord.xy), 0).r;
            if (u_active) {
                float f = stroke(gl_FragCoord.xy, u_from, u_to, RADIUS);
                speed = max(speed, f * length(u_to - u_from) / u_dt);
            }
            fragColor = vec4(speed, 0.0, 0.0, 1.0);
        }`;

        // downhill on the ridge
        const BIAS_FS = `#version 300 es
        precision highp float;
        precision highp sampler2D;
        uniform sampler2D u_trail;
        out vec4 fragColor;

        const float WAKE_STRENGTH = 0.02; // lean, per (cells/s)/cell of slope

        float height(ivec2 p) {
            return texelFetch(u_trail, clamp(p, ivec2(0), textureSize(u_trail, 0) - 1), 0).r;
        }

        void main() {
            ivec2 p = ivec2(gl_FragCoord.xy);
            vec2 slope = 0.5 * vec2(height(p + ivec2(1, 0)) - height(p - ivec2(1, 0)),
                                    height(p + ivec2(0, 1)) - height(p - ivec2(0, 1)));
            fragColor = vec4(-WAKE_STRENGTH * slope, 0.0, 1.0);
        }`;

        const canvas = document.querySelector('#glCanvas');
        const gl = createContext(canvas);
        const board = createBoard(gl);
        const cursor = trackCursor(canvas);

        const trailProgram = createProgram(gl, TRAIL_FS);
        const biasProgram = createProgram(gl, BIAS_FS);
        const trail = createDouble(() => createField(gl, board.size));
        const bias = createField(gl, board.size);

        run(board, dt => {
            const stroke = cursor.stroke();
            pass(gl, trailProgram, trail.write, {
                u_from: stroke?.[0] ?? [0, 0],
                u_to: stroke?.[1] ?? [0, 0],
                u_active: stroke !== null,
                u_dt: dt,
                u_fade: Math.pow(0.5, dt / TRAIL_HALF_LIFE),
            }, { u_trail: trail.read.texture });
            trail.swap();

            pass(gl, biasProgram, bias, {}, { u_trail: trail.read.texture });
            return { texture: bias.texture, scale: 1 };
        });
    </script>
</body>
</html>
