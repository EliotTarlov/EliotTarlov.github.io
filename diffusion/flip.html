<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diffusion: FLIP</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="glCanvas"></canvas>

    <!-- A FLIP fluid (FLuid-Implicit-Particle) the cursor stirs.

         The particles are the fluid: each has its own position and velocity, and
         moves by them. A grid GRID_SCALE canvas pixels per cell is scratch space
         for what particles are bad at, keeping the fluid from piling up. Every
         display frame:
           to grid     each particle adds its velocity to the four nearest cells,
                       weighted by closeness; each cell averages what it got
           forces      paint the cursor's stroke into the grid's velocity
           project     remove divergence, and push apart cells denser than
                       PARTICLES_PER_CELL (see projection.js)
           to particles
                       each particle takes on the change the grid made to the
                       velocity around it (FLIP), blended with a little of the
                       grid's velocity itself (PIC) to damp noise
           move        particles move along the grid's flow, plus a small
                       random nudge, which is diffusion
         F overlays the grid's flow: hue is direction, brightness is speed. -->
    <script type="module">
        import { createContext, createProgram, createTarget, createField, createDouble, trackCursor, pass, drawPoints, clear, RANDOM_GLSL, STROKE_GLSL } from './diffusion.js';
        import { createProjection, GRID_HEADER } from './projection.js';

        const GRID_SCALE = 4;           // canvas pixels per grid cell
        const PARTICLES_PER_CELL = 4;
        const STIFFNESS = 2.0;          // how hard crowded cells push particles apart, 1/s
        const VELOCITY_HALF_LIFE = .1;   // seconds for the flow to slow to half
        const POINT_SIZE = 2;           // canvas pixels per particle
        const BRIGHTNESS = 0.4;         // added by each particle

        const PARTICLE_HEADER = `#version 300 es
        precision highp float;
        precision highp sampler2D;
        uniform sampler2D u_particles;  // xy: position in grid cells, zw: velocity in cells/s

        vec4 particle(int i) {
            int width = textureSize(u_particles, 0).x;
            return texelFetch(u_particles, ivec2(i % width, i / width), 0);
        }
        `;

        // Four points per particle, one on each of the four nearest cells,
        // carrying its velocity times its closeness to that cell
        const TO_GRID_VS = PARTICLE_HEADER + `
        uniform vec2 u_gridSize;
        out vec4 v_share;              // xy: weighted velocity, z: weight

        void main() {
            vec4 p = particle(gl_VertexID / 4);
            int corner = gl_VertexID % 4;

            // cell centers sit at +0.5
            vec2 base = floor(p.xy - 0.5);
            vec2 f = p.xy - 0.5 - base;
            vec2 offset = vec2(corner & 1, corner >> 1);
            vec2 closeness = mix(1.0 - f, f, offset);
            float weight = closeness.x * closeness.y;

            v_share = vec4(weight * p.zw, weight, 0.0);
            gl_Position = vec4((base + offset + 0.5) / u_gridSize * 2.0 - 1.0, 0.0, 1.0);
            gl_PointSize = 1.0;
        }`;

        const TO_GRID_FS = `#version 300 es
        precision highp float;
        in vec4 v_share;
        out vec4 fragColor;
        void main() { fragColor = v_share; }`;

        // xy: average velocity of the particles around each cell, z: how many there are
        const AVERAGE_FS = GRID_HEADER + `
        uniform sampler2D u_sums;

        void main() {
            vec4 s = at(u_sums, ivec2(gl_FragCoord.xy));
            vec2 v = s.z > 1e-4 ? s.xy / s.z : vec2(0.0);
            fragColor = vec4(v, s.z, 1.0);
        }`;

        const FORCES_FS = GRID_HEADER + `
        uniform sampler2D u_velocity;
        uniform vec2 u_from;           // cursor at the previous frame, in grid cells
        uniform vec2 u_to;             // cursor now, in grid cells
        uniform bool u_active;         // whether the cursor is on the canvas
        uniform float u_dt;

        const float RADIUS = 5.0;      // width of the stroke, in grid cells
        ${STROKE_GLSL}

        void main() {
            vec4 v = at(u_velocity, ivec2(gl_FragCoord.xy));
            if (u_active) {
                v.xy = mix(v.xy, (u_to - u_from) / u_dt, stroke(gl_FragCoord.xy, u_from, u_to, RADIUS));
            }
            fragColor = v;
        }`;

        // one texel per particle
        const TO_PARTICLES_FS = PARTICLE_HEADER + `
        uniform sampler2D u_velocity;  // the grid's velocity after forces and projection
        uniform sampler2D u_averaged;  // the grid's velocity before
        uniform vec2 u_gridSize;
        uniform float u_dt;
        uniform float u_decay;         // how much of each particle's velocity survives this frame
        uniform int u_frame;
        out vec4 fragColor;

        const float FLIP_RATIO = 0.95; // rest is PIC: 1 keeps every detail and all the noise
        const float JITTER = 1.0;      // random nudge, cells per sqrt(second)
        ${RANDOM_GLSL}

        vec2 flow(sampler2D grid, vec2 pos) {
            return textureLod(grid, pos / u_gridSize, 0.0).xy;
        }

        void main() {
            ivec2 texel = ivec2(gl_FragCoord.xy);
            vec4 p = texelFetch(u_particles, texel, 0);

            vec2 now = flow(u_velocity, p.xy);
            vec2 flip = p.zw + now - flow(u_averaged, p.xy);
            vec2 velocity = u_decay * mix(now, flip, FLIP_RATIO);

            // along the grid's flow, sampled halfway along the step
            vec2 pos = p.xy + u_dt * flow(u_velocity, p.xy + 0.5 * u_dt * now);

            // Box-Muller normal pair
            uint state = hash(uint(texel.x) ^ hash(uint(texel.y) ^ hash(uint(u_frame))));
            float r = sqrt(-2.0 * log(max(rand(state), 1e-7)));
            float angle = 6.28318530718 * rand(state);
            pos += JITTER * sqrt(u_dt) * r * vec2(cos(angle), sin(angle));

            pos = clamp(pos, vec2(0.01), u_gridSize - 0.01);
            fragColor = vec4(pos, velocity);
        }`;

        const DRAW_VS = PARTICLE_HEADER + `
        uniform vec2 u_gridSize;
        uniform float u_pointSize;

        void main() {
            gl_Position = vec4(particle(gl_VertexID).xy / u_gridSize * 2.0 - 1.0, 0.0, 1.0);
            gl_PointSize = u_pointSize;
        }`;

        const DRAW_FS = `#version 300 es
        precision highp float;
        uniform float u_brightness;
        out vec4 fragColor;
        void main() { fragColor = vec4(vec3(u_brightness), 1.0); }`;

        // the grid's flow over the canvas: hue is direction, brightness is speed
        const FIELD_FS = `#version 300 es
        precision highp float;
        precision highp sampler2D;
        uniform sampler2D u_velocity;
        uniform vec2 u_canvasSize;
        out vec4 fragColor;

        const float FIELD_GAIN = 0.02; // how quickly the overlay brightens with speed, per cell/s

        vec3 hue(float angle) {
            return 0.5 + 0.5 * cos(angle + vec3(0.0, -2.0944, 2.0944));
        }

        void main() {
            vec2 v = textureLod(u_velocity, gl_FragCoord.xy / u_canvasSize, 0.0).xy;
            fragColor = vec4(0.6 * hue(atan(v.y, v.x)) * (1.0 - exp(-FIELD_GAIN * length(v))), 1.0);
        }`;

        const canvas = document.querySelector('#glCanvas');
        const gl = createContext(canvas);
        const gridSize = [Math.ceil(canvas.width / GRID_SCALE), Math.ceil(canvas.height / GRID_SCALE)];
        const cursor = trackCursor(canvas, GRID_SCALE, 0);

        const toGridProgram = createProgram(gl, TO_GRID_FS, TO_GRID_VS);
        const averageProgram = createProgram(gl, AVERAGE_FS);
        const forcesProgram = createProgram(gl, FORCES_FS);
        const toParticlesProgram = createProgram(gl, TO_PARTICLES_FS);
        const drawProgram = createProgram(gl, DRAW_FS, DRAW_VS);
        const fieldProgram = createProgram(gl, FIELD_FS);

        const sums = createField(gl, gridSize);
        const averaged = createField(gl, gridSize);
        const velocity = createDouble(() => createField(gl, gridSize));
        const project = createProjection(gl, gridSize);

        // particles live one per texel; positions need full floats to stay precise across the grid
        const count = gridSize[0] * gridSize[1] * PARTICLES_PER_CELL;
        const particleSize = [1024, Math.ceil(count / 1024)];
        const particles = createDouble(() => createTarget(gl, particleSize, gl.RGBA32F, gl.RGBA, gl.FLOAT, gl.NEAREST));

        // start evenly spread and still: PARTICLES_PER_CELL at random spots in each cell
        const initial = new Float32Array(particleSize[0] * particleSize[1] * 4);
        for (let i = 0; i < count; i++) {
            const cell = Math.floor(i / PARTICLES_PER_CELL);
            initial[4 * i] = cell % gridSize[0] + Math.random();
            initial[4 * i + 1] = Math.floor(cell / gridSize[0]) + Math.random();
        }
        gl.bindTexture(gl.TEXTURE_2D, particles.read.texture);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, particleSize[0], particleSize[1], gl.RGBA, gl.FLOAT, initial);

        let showField = false;
        window.addEventListener('keydown', e => {
            if (e.key === 'f') showField = !showField;
        });

        let frame = 0;
        let lastFrameTime = null;
        function render(now) {
            // capped, since a long frame, like a backgrounded tab's, would fling the fluid
            const dt = Math.min(Math.max((now - (lastFrameTime ?? now)) / 1000, 1e-3), 1 / 30);
            lastFrameTime = now;

            clear(gl, sums);
            drawPoints(gl, toGridProgram, sums, 4 * count, { u_gridSize: gridSize },
                { u_particles: particles.read.texture });
            pass(gl, averageProgram, averaged, {}, { u_sums: sums.texture });

            const stroke = cursor.stroke();
            pass(gl, forcesProgram, velocity.write, {
                u_from: stroke?.[0] ?? [0, 0],
                u_to: stroke?.[1] ?? [0, 0],
                u_active: stroke !== null,
                u_dt: dt,
            }, { u_velocity: averaged.texture });
            velocity.swap();

            project(velocity, STIFFNESS, PARTICLES_PER_CELL);

            pass(gl, toParticlesProgram, particles.write, {
                u_gridSize: gridSize,
                u_dt: dt,
                u_decay: Math.pow(0.5, dt / VELOCITY_HALF_LIFE),
                u_frame: frame,
            }, { u_particles: particles.read.texture, u_velocity: velocity.read.texture, u_averaged: averaged.texture });
            particles.swap();

            clear(gl, null);
            if (showField) {
                pass(gl, fieldProgram, null, { u_canvasSize: [canvas.width, canvas.height] },
                    { u_velocity: velocity.read.texture });
            }
            drawPoints(gl, drawProgram, null, count,
                { u_gridSize: gridSize, u_pointSize: POINT_SIZE, u_brightness: BRIGHTNESS },
                { u_particles: particles.read.texture });

            frame++;
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    </script>
</body>
</html>
