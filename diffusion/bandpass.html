<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diffusion: Bandpass</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="glCanvas"></canvas>

    <!-- point.html, drawn with the bandpass display: the board's density
         fluctuations between SMALL_SIGMA and LARGE_SIGMA cells across, at full
         contrast (see bandpass.js). Any page can use the display the same way. -->
    <script type="module">
        import { createContext, createProgram, createField, createBoard, trackCursor, pass, run } from './diffusion.js';
        import { createBandpassDisplay } from './bandpass.js';

        const SMALL_SIGMA = 4;   // finest blobs shown, in cells
        const LARGE_SIGMA = 16;  // coarsest blobs shown, in cells

        const BIAS_FS = `#version 300 es
        precision highp float;
        uniform vec2 u_target;         // cursor, in board cells
        uniform bool u_active;         // whether the cursor is on the canvas
        out vec4 fragColor;

        const float STRENGTH = -0.05;  // lean towards the cursor

        void main() {
            vec2 toTarget = u_target - gl_FragCoord.xy;
            float dist = length(toTarget);
            vec2 bias = (u_active && dist > 0.0) ? STRENGTH * toTarget / dist : vec2(0.0);
            fragColor = vec4(bias, 0.0, 1.0);
        }`;

        const canvas = document.querySelector('#glCanvas');
        const gl = createContext(canvas);
        const board = createBoard(gl);
        const cursor = trackCursor(canvas);

        const biasProgram = createProgram(gl, BIAS_FS);
        const bias = createField(gl, board.size);

        run(board, () => {
            pass(gl, biasProgram, bias, { u_target: cursor.pos ?? [0, 0], u_active: cursor.pos !== null });
            return { texture: bias.texture, scale: 1 };
        }, createBandpassDisplay(gl, board, SMALL_SIGMA, LARGE_SIGMA));
    </script>
</body>
</html>
