<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diffusion: Turing</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="glCanvas"></canvas>

    <!-- Particles that sense each other: each leans towards where particles are
         crowded within about SMALL_SIGMA cells, and away from where they're
         crowded within about LARGE_SIGMA cells. Short-range attraction clumps
         them; long-range repulsion stops the clumps growing without limit. The
         balance gives spots and labyrinths spaced about 10 * SMALL_SIGMA cells
         apart (with LARGE_SIGMA = 4 * SMALL_SIGMA), the same mechanism as a
         Turing pattern's short-range activation and long-range inhibition.

         Below AGGREGATION ~0.65 diffusion wins and the board stays evenly grey.
         The cursor pushes particles away, to stir the pattern. -->
    <script type="module">
        import { createContext, createProgram, createField, createBoard, trackCursor, pass, run } from './diffusion.js';
        import { createDensityBlur } from './blur.js';

        const SMALL_SIGMA = 4;   // reach of the attraction, in cells
        const LARGE_SIGMA = 16;  // reach of the repulsion, in cells

        // lean up the slope of (nearby crowding - wider crowding) / wider crowding,
        // plus away from the cursor
        const BIAS_FS = `#version 300 es
        precision highp float;
        precision highp sampler2D;
        uniform sampler2D u_blur;      // x: density blurred at SMALL_SIGMA, y: at LARGE_SIGMA
        uniform vec2 u_target;         // cursor, in board cells
        uniform bool u_active;         // whether the cursor is on the canvas
        out vec4 fragColor;

        const float AGGREGATION = 1.5; // lean per unit of slope
        const float PUSH = 1.0;        // lean away from the cursor, at its center
        const float PUSH_RADIUS = 40.0;

        float crowding(ivec2 p) {
            vec2 b = texelFetch(u_blur, clamp(p, ivec2(0), textureSize(u_blur, 0) - 1), 0).xy;
            return (b.x - b.y) / max(b.y, 1.0);
        }

        void main() {
            ivec2 p = ivec2(gl_FragCoord.xy);
            vec2 bias = AGGREGATION * 0.5 * vec2(crowding(p + ivec2(1, 0)) - crowding(p - ivec2(1, 0)),
                                                 crowding(p + ivec2(0, 1)) - crowding(p - ivec2(0, 1)));
            if (u_active) {
                vec2 away = gl_FragCoord.xy - u_target;
                bias += PUSH * normalize(away + 1e-6) * exp(-dot(away, away) / (PUSH_RADIUS * PUSH_RADIUS));
            }
            fragColor = vec4(bias, 0.0, 1.0);
        }`;

        const canvas = document.querySelector('#glCanvas');
        const gl = createContext(canvas);
        const board = createBoard(gl);
        const cursor = trackCursor(canvas);

        const blur = createDensityBlur(gl, board, SMALL_SIGMA, LARGE_SIGMA);
        const biasProgram = createProgram(gl, BIAS_FS);
        const bias = createField(gl, board.size);

        run(board, () => {
            blur.refresh();
            pass(gl, biasProgram, bias, { u_target: cursor.pos ?? [0, 0], u_active: cursor.pos !== null },
                { u_blur: blur.current });
            return { texture: bias.texture, scale: 1 };
        });
    </script>
</body>
</html>
